<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Make an Enquiry | Custom Cakes and Orders | Sweet Crumbs Bakery</title>
  <meta name="description" content="Planning a birthday, wedding or special event? Send an enquiry to Sweet Crumbs Bakery in Nkomazi for custom cakes and orders and get an estimated cost.">
  <meta name="keywords" content="custom cake enquiry, wedding cakes Nkomazi, birthday cakes Mpumalanga, bakery orders">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lora:wght@400;700&family=Open+Sans:wght@400;600&display=swap">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <header>
    <div class="logo">
      <img src="images/logo.png" alt="Sweet Crumbs Bakery logo" class="logo-img">
      <span>Sweet Crumbs Bakery</span>
    </div>
    <nav>
      <ul>
        <li><a href="index.html">Home</a></li>
        <li><a href="about.html">About</a></li>
        <li><a href="products.html">Products</a></li>
        <li><a href="enquiry.html">Enquiry</a></li>
        <li><a href="contact.html">Contact</a></li>
      </ul>
    </nav>
  </header>

  <main>
    <section>
      <h1>Make an Enquiry</h1>
      <p>Planning a celebration or have a special order in mind? Fill in the form below and we'll get back to you.</p>
    </section>

    <section>
      <h2>your details</h2>
      <form id="enquiryForm" novalidate>
        <div>
          <label for="name">Full Name</label>
          <input type="text" id="name" name="name" required minlength="2" maxlength="50" data-rule="name" autocomplete="name">
          <span class="error" id="name-error"></span>
        </div>

        <div>
          <label for="email">Email Address</label>
          <input type="email" id="email" name="email" required data-rule="email" autocomplete="email">
          <span class="error" id="email-error"></span>
        </div>

        <div>
          <label for="phone">Phone Number</label>
          <input type="tel" id="phone" name="phone" required pattern="^(\+27|0)[0-9 ]{9,12}$" data-rule="phone" autocomplete="tel" placeholder="082 123 4567">
          <span class="error" id="phone-error"></span>
        </div>

        <div>
          <label for="occasion">Occasion</label>
          <select id="occasion" name="occasion" required data-rule="occasion">
            <option value="">Choose...</option>
            <option value="Birthday">Birthday</option>
            <option value="Wedding">Wedding</option>
            <option value="Baby shower">Baby shower</option>
            <option value="Corporate event">Corporate event</option>
            <option value="Other">Other</option>
          </select>
          <span class="error" id="occasion-error"></span>
        </div>

        <div>
          <label for="eventDate">Event Date</label>
          <input type="date" id="eventDate" name="eventDate" required data-rule="eventDate">
          <span class="error" id="eventDate-error"></span>
        </div>

        <div>
          <label for="guests">Number of Guests</label>
          <input type="number" id="guests" name="guests" min="1" max="300" required data-rule="guests">
          <span class="error" id="guests-error"></span>
        </div>

        <div>
          <label for="message">Message</label>
          <textarea id="message" name="message" rows="5" required minlength="10" maxlength="500" data-rule="message"></textarea>
          <span class="error" id="message-error"></span>
        </div>

        <button type="submit">Send Enquiry</button>
      </form>

      <p id="formResponse" role="status"></p>
    </section>
  </main>

  <footer>
    <p>Copyright 2026 Sweet Crumbs Bakery. All rights reserved.</p>
  </footer>

  <script src="js/main.js" defer></script>
  <script src="js/forms.js" defer></script>
</body>
</html>
